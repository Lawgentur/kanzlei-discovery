name: Kanzlei Discovery Pipeline

on:
  workflow_dispatch:
    inputs:
      scrape:
        description: "Scrape target firm career pages after Drive sync"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      limit:
        description: "Optional firm limit for smoke tests"
        required: false
        default: ""

concurrency:
  group: kanzlei-discovery
  cancel-in-progress: false

jobs:
  pipeline:
    name: Sync, Scrape, Export
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pipeline
        id: pipeline
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DAYS_UNTIL_DELETION: "30"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.scrape }}" = "true" ]; then
            ARGS="$ARGS --scrape"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          kanzlei-discovery $ARGS | tee pipeline_output.log
          MSG=$(grep "^COMMIT_MSG=" pipeline_output.log | tail -1 | cut -d= -f2-)
          echo "commit_msg=${MSG}" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        run: |
          git config --global user.name "Lawgentur Bot"
          git config --global user.email "bot@lawgentur.de"
          git add jobs_master.csv target_firms_full.csv sync_state.json media/jobs_master_public.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            MSG="${{ steps.pipeline.outputs.commit_msg }}"
            if [ -z "$MSG" ]; then
              MSG="Automatisches Jobs-Update $(date +%Y-%m-%d)"
            fi
            git commit -m "$MSG"
            git push
          fi
