name: Test Scrape (Quick)

on:
  workflow_dispatch:
    inputs:
      num_firms:
        description: 'Anzahl Kanzleien zum Testen'
        required: false
        default: '20'

permissions:
  contents: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt
      
      - name: Dependencies installieren
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium
      
      - name: Test-Scrape ausführen
        run: |
          python scraper/job_scraper.py \
            --mode batch \
            --batch-index 0 \
            --batch-size ${{ github.event.inputs.num_firms }} \
            --target-csv target_firms_full.csv \
            --output-dir test_results
      
      - name: Ergebnisse als Artifact speichern
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results/
          retention-days: 7
