name: Weekly Job Scrape

on:
  schedule:
    # Jeden Sonntag um 02:00 UTC (04:00 MEZ)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Anzahl Kanzleien pro Batch'
        required: false
        default: '400'
      max_batches:
        description: 'Maximale Anzahl Batches (0 = alle)'
        required: false
        default: '0'

permissions:
  contents: write
  
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  BATCH_SIZE: ${{ github.event.inputs.batch_size || '400' }}

jobs:
  # ===== SCHRITT 1: Batch-Matrix berechnen =====
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_firms: ${{ steps.set-matrix.outputs.total_firms }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Batch-Matrix berechnen
        id: set-matrix
        run: |
          TOTAL=$(tail -n +2 target_firms_full.csv | wc -l)
          BATCH_SIZE=${{ env.BATCH_SIZE }}
          MAX_BATCHES=${{ github.event.inputs.max_batches || '0' }}
          
          NUM_BATCHES=$(( (TOTAL + BATCH_SIZE - 1) / BATCH_SIZE ))
          
          if [ "$MAX_BATCHES" -gt "0" ] && [ "$MAX_BATCHES" -lt "$NUM_BATCHES" ]; then
            NUM_BATCHES=$MAX_BATCHES
          fi
          
          if [ "$NUM_BATCHES" -gt "10" ]; then
            NUM_BATCHES=10
          fi
          
          MATRIX="["
          for i in $(seq 0 $((NUM_BATCHES - 1))); do
            if [ $i -gt 0 ]; then MATRIX="$MATRIX,"; fi
            MATRIX="$MATRIX$i"
          done
          MATRIX="$MATRIX]"
          
          echo "matrix={\"batch_index\":$MATRIX}" >> $GITHUB_OUTPUT
          echo "total_firms=$TOTAL" >> $GITHUB_OUTPUT

  # ===== SCHRITT 2: Paralleles Scraping =====
  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt
      
      - name: Dependencies installieren
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium
      
      - name: "Batch ${{ matrix.batch_index }} scrapen"
        run: |
          python scraper/job_scraper.py \
            --mode batch \
            --batch-index ${{ matrix.batch_index }} \
            --batch-size ${{ env.BATCH_SIZE }} \
            --target-csv target_firms_full.csv \
            --output-dir batch_results
             env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Batch-Ergebnisse hochladen
        uses: actions/upload-artifact@v4
        with:
          name: batch-results-${{ matrix.batch_index }}
          path: batch_results/
          retention-days: 1

  # ===== SCHRITT 3: Ergebnisse zusammenführen =====
  merge:
    needs: [prepare, scrape]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Dependencies installieren
        run: pip install -r scraper/requirements.txt
      
      - name: Alle Batch-Ergebnisse herunterladen
        uses: actions/download-artifact@v4
        with:
          path: batch_results/
          pattern: batch-results-*
          merge-multiple: true
      
      - name: Ergebnisse zusammenführen
        run: |
          python scraper/job_scraper.py \
            --mode merge \
            --output-dir batch_results \
            --master-csv jobs_master.csv
      
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          DATE=$(date +%Y-%m-%d)
          if [ -f jobs_master.csv ]; then
            cp jobs_master.csv "jobs_master_${DATE}.csv"
          fi
          
          git add jobs_master.csv
          git add "jobs_master_${DATE}.csv" 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen"
          else
            git commit -m "Weekly scrape: ${DATE}"
            git push
          fi
