[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanzlei-discovery"
version = "0.1.0"
description = "Pipeline for discovering, normalizing, and exporting German law firm job postings."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.11.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "playwright>=1.40.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
kanzlei-discovery = "kanzlei_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
